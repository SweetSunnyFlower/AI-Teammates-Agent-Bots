apiVersion: v1
kind: Secret
metadata:
  name: dotty-db
  namespace: dotty
type: Opaque
stringData:
  POSTGRES_PASSWORD: "dotty"
---
apiVersion: v1
kind: Secret
metadata:
  name: dotty-secrets
  namespace: dotty
type: Opaque
stringData:
  BETTER_AUTH_SECRET: "replace-with-openssl-rand-base64-32"
  DEEPSEEK_API_KEY: "replace-with-deepseek-api-key"
  SMTP_HOST: "smtp.qq.com"
  SMTP_PORT: "587"
  SMTP_USER: "you@example.com"
  SMTP_PASS: "replace-with-smtp-authorization-code"
  EMAIL_FROM: "you@example.com"
  SEARXNG_SECRET: "replace-with-openssl-rand-hex-32"

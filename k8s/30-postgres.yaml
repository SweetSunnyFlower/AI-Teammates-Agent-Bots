apiVersion: v1
kind: Service
metadata:
  name: dotty-postgres
  namespace: dotty
spec:
  selector:
    app: dotty-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: dotty-postgres
  namespace: dotty
spec:
  serviceName: dotty-postgres
  replicas: 1
  selector:
    matchLabels:
      app: dotty-postgres
  template:
    metadata:
      labels:
        app: dotty-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              value: dotty
            - name: POSTGRES_DB
              value: dotty
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dotty-db
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "dotty", "-d", "dotty"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "dotty", "-d", "dotty"]
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi

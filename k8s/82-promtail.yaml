apiVersion: v1
kind: ServiceAccount
metadata:
  name: dotty-promtail
  namespace: dotty
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dotty-promtail
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces", "nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dotty-promtail
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dotty-promtail
subjects:
  - kind: ServiceAccount
    name: dotty-promtail
    namespace: dotty
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dotty-promtail-config
  namespace: dotty
data:
  config.yml: |
    server:
      http_listen_port: 9080
      grpc_listen_port: 0

    positions:
      filename: /tmp/positions.yaml

    clients:
      - url: http://dotty-loki:3100/loki/api/v1/push

    scrape_configs:
      - job_name: dotty-pods
        static_configs:
          - targets:
              - localhost
            labels:
              namespace: dotty
              job: dotty-pods
              __path__: /var/log/pods/dotty_*/*/*.log
        pipeline_stages:
          - docker: {}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: dotty-promtail
  namespace: dotty
spec:
  selector:
    matchLabels:
      app: dotty-promtail
  template:
    metadata:
      labels:
        app: dotty-promtail
    spec:
      serviceAccountName: dotty-promtail
      tolerations:
        - operator: Exists
      containers:
        - name: promtail
          image: grafana/promtail:2.9.8
          imagePullPolicy: IfNotPresent
          args:
            - -config.file=/etc/promtail/config.yml
          ports:
            - name: http
              containerPort: 9080
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: config
              mountPath: /etc/promtail
            - name: positions
              mountPath: /tmp
            - name: pods
              mountPath: /var/log/pods
              readOnly: true
            - name: containers
              mountPath: /var/lib/docker/containers
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: dotty-promtail-config
        - name: positions
          emptyDir: {}
        - name: pods
          hostPath:
            path: /var/log/pods
            type: Directory
        - name: containers
          hostPath:
            path: /var/lib/docker/containers
            type: Directory

apiVersion: v1
kind: Service
metadata:
  name: dotty-web
  namespace: dotty
spec:
  selector:
    app: dotty-web
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dotty-web
  namespace: dotty
spec:
  replicas: 3
  selector:
    matchLabels:
      app: dotty-web
  template:
    metadata:
      labels:
        app: dotty-web
    spec:
      containers:
        - name: web
          image: dotty-app:dev
          imagePullPolicy: IfNotPresent
          command: ["node", "node_modules/next/dist/bin/next", "start"]
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: dotty-config
            - secretRef:
                name: dotty-secrets
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dotty-db
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: "postgresql://dotty:$(POSTGRES_PASSWORD)@dotty-postgres:5432/dotty"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
